name: CleanFiling
options:
  bundleIdPrefix: com.cleanfiling
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0

targets:
  CleanFiling:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: CleanFiling
    configFiles:
      Debug: Config/GoogleAuth.xcconfig
      Release: Config/GoogleAuth.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cleanfiling.app
        PRODUCT_NAME: CleanFiling
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_FILE: CleanFiling/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
