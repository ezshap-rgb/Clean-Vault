<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Clean Vault</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070913">

  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-base: #070913;
      --surface: #0E1324;
      --surface-card: #10172B;
      --surface-raised: #151C33;
      --surface-hover: #1E284A;
      --border: #1E2746;
      --border-highlight: #2F3E6C;
      --accent: #5C4FEE;
      --accent-mid: #A816DF;
      --accent-hover: #6D61FF;
      --accent-glow: rgba(92, 79, 238, 0.4);
      --warning: #F50ACE;
      --magenta-glow: rgba(245, 10, 206, 0.4);
      --amber: #F59E0B;
      --amber-hover: #FBBF24;
      --amber-glow: rgba(245, 158, 11, 0.45);
      --blue-indigo: #4F68FF;
      --rose: #F43F5E;
      --emerald: #10B981;
      --text-main: #FFFFFF;
      --text-muted: #CBD5E1;
      --text-faint: #94A3B8;
      --gradient: linear-gradient(135deg, #5C4FEE 0%, #A816DF 50%, #F50ACE 100%);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-card: 22px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 16px));
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(92, 79, 238, 0.16) 0%, rgba(245, 10, 206, 0.08) 50%, transparent 70%);
      z-index: -1;
      pointer-events: none;
    }

    .app-shell {
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Top Streamlined Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
      position: sticky;
      top: env(safe-area-inset-top, 8px);
      z-index: 40;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo-img {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 14px var(--accent-glow);
      border: 1px solid rgba(245, 10, 206, 0.35);
      flex-shrink: 0;
    }

    .brand-title {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      line-height: 1.1;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sync-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px var(--emerald);
      transition: all 0.2s;
    }

    .sync-indicator.syncing {
      background: var(--amber);
      box-shadow: 0 0 8px var(--amber);
      animation: pulse 1s infinite;
    }

    .sync-indicator.error {
      background: var(--rose);
      box-shadow: 0 0 8px var(--rose);
    }

    /* Settings Wheel Button (no words, clean icon) */
    .btn-settings-wheel {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-settings-wheel:active {
      transform: scale(0.92) rotate(45deg);
    }

    .btn-settings-wheel svg {
      width: 19px;
      height: 19px;
      stroke-width: 2;
    }

    /* Cards */
    .card {
      background: var(--surface-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      padding: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      position: relative;
    }

    .card-title-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .card-heading {
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-heading svg {
      width: 18px;
      height: 18px;
      color: var(--amber);
    }

    /* Clean Camera Tap Area (icon only, minimal words) */
    .camera-box {
      position: relative;
      border: 2px dashed var(--border-highlight);
      border-radius: var(--radius-lg);
      background: rgba(14, 19, 36, 0.6);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      overflow: hidden;
      min-height: 140px;
      transition: border-color 0.2s, background 0.2s;
    }

    .camera-box:hover {
      border-color: var(--accent);
      background: rgba(21, 28, 51, 0.7);
    }

    .camera-circle {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      background: var(--gradient);
      box-shadow: 0 4px 16px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      transition: transform 0.15s;
    }

    .camera-box:active .camera-circle {
      transform: scale(0.92);
    }

    .preview-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: var(--radius-lg);
    }

    .btn-remove-preview {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(7, 9, 19, 0.85);
      border: 1px solid rgba(244, 63, 94, 0.5);
      color: var(--rose);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(8px);
      z-index: 10;
    }

    .btn-choose-file {
      margin-top: 10px;
      width: 100%;
      padding: 9px 14px;
      border-radius: var(--radius-md);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-choose-file:active {
      transform: scale(0.98);
      background: var(--surface-hover);
    }

    /* Dictate / Note Bar */
    .dictate-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px 10px;
      margin-top: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .dictate-bar:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 14px var(--accent-glow);
    }

    .btn-mic {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--surface-hover);
      border: 1px solid var(--border-highlight);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-mic:active {
      transform: scale(0.92);
    }

    .btn-mic.recording {
      background: var(--rose);
      color: #FFFFFF;
      border-color: var(--rose);
      animation: pulseMic 1.3s infinite;
    }

    @keyframes pulseMic {
      0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(244, 63, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
    }

    .input-field {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #FFFFFF;
      font-size: 0.88rem;
      font-family: inherit;
      user-select: text;
    }

    .input-field::placeholder {
      color: var(--text-faint);
    }

    /* Extraction card */
    .extraction-box {
      margin-top: 12px;
      padding: 14px;
      border-radius: var(--radius-lg);
      background: var(--surface-raised);
      border: 1px solid rgba(168, 22, 223, 0.4);
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeIn 0.2s ease-out;
    }

    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-label {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-faint);
      text-transform: uppercase;
    }

    .form-input, .form-select {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 7px 10px;
      font-size: 0.82rem;
      color: #FFFFFF;
      outline: none;
      font-family: inherit;
      user-select: text;
    }

    .form-input.mono {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 600;
    }

    .form-input:focus, .form-select:focus {
      border-color: var(--accent);
    }

    /* Primary CTA */
    .btn-file-submit {
      margin-top: 12px;
      width: 100%;
      padding: 12px 18px;
      border-radius: var(--radius-lg);
      background: var(--gradient);
      color: #FFFFFF;
      font-size: 0.92rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px var(--accent-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.15s, opacity 0.15s;
    }

    .btn-file-submit:active {
      transform: scale(0.98);
    }

    .btn-file-submit:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Retrieve Card with two fields: AI Ask + Ledger Button */
    .retrieval-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ask-row {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 6px 10px;
      transition: border-color 0.2s;
    }

    .ask-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .btn-ask-submit {
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: var(--gradient);
      border: none;
      color: #FFFFFF;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .btn-ask-submit:active {
      transform: scale(0.95);
    }

    .btn-open-ledger {
      width: 100%;
      padding: 11px 16px;
      border-radius: var(--radius-md);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.86rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-open-ledger:active {
      transform: scale(0.98);
      background: var(--surface-hover);
    }

    .ledger-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      font-weight: 700;
      background: var(--surface);
      border: 1px solid var(--border-highlight);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      color: var(--amber);
    }

    /* Modal / Popups for Ledger and Settings */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(7, 9, 19, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      z-index: 100;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 12px;
      animation: fadeIn 0.2s ease-out;
    }

    @media (min-width: 640px) {
      .modal-overlay {
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
    }

    .modal-dialog {
      background: var(--surface);
      border: 1px solid var(--border-highlight);
      border-radius: var(--radius-card);
      width: 100%;
      max-width: 600px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-close-modal {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--surface-raised);
      border: 1px solid var(--border);
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Ledger List items */
    .receipt-item {
      background: var(--surface-raised);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .receipt-vendor {
      font-size: 0.9rem;
      font-weight: 700;
      color: #FFFFFF;
    }

    .receipt-meta {
      font-size: 0.72rem;
      color: var(--text-faint);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .receipt-tag {
      padding: 2px 6px;
      border-radius: var(--radius-pill);
      background: var(--surface);
      font-size: 0.65rem;
      color: var(--amber);
      font-weight: 600;
    }

    .receipt-amount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--emerald);
      text-align: right;
    }

    .btn-drive-link {
      display: inline-block;
      margin-top: 4px;
      font-size: 0.68rem;
      color: #A816DF;
      text-decoration: underline;
    }

    /* AI Response Card */
    .ai-reply-card {
      margin-top: 10px;
      padding: 14px;
      border-radius: var(--radius-md);
      background: rgba(92, 79, 238, 0.12);
      border: 1px solid rgba(168, 22, 223, 0.4);
      font-size: 0.86rem;
      line-height: 1.45;
      color: #F8FAFC;
    }

    .chips-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .query-chip {
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--surface-raised);
      border: 1px solid var(--border);
      font-size: 0.7rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
    }

    /* Toast */
    .status-toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      background: var(--surface-raised);
      border: 1px solid var(--border-highlight);
      color: #FFFFFF;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      pointer-events: none;
    }

    .status-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .status-toast.success { border-color: var(--emerald); }
    .status-toast.error { border-color: var(--rose); }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="statusToast" class="status-toast">
    <span id="toastMsg">Saved</span>
  </div>

  <div class="app-shell">

    <!-- Clean Header with Settings Wheel (no text) -->
    <header>
      <div class="brand">
        <img src="icon.png" alt="Clean Vault" class="brand-logo-img">
        <h1 class="brand-title">Clean Vault</h1>
      </div>
      <div class="header-actions">
        <div id="syncIndicator" class="sync-indicator" title="Cloud Sync Status"></div>
        <button id="btnOpenSettings" class="btn-settings-wheel" title="Settings">
          <!-- Clean Settings Gear Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- ============================================== -->
    <!-- CARD 1: FILE (Streamlined Intake)              -->
    <!-- ============================================== -->
    <section class="card">
      <div class="card-title-bar">
        <span class="card-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          File
        </span>
      </div>

      <!-- Camera Tap Zone (Simple camera icon, no extra clutter) -->
      <div id="cameraBox" class="camera-box" title="Tap to snap photo">
        <img id="imagePreview" class="preview-img hidden" alt="Receipt">
        
        <div id="cameraIconWrap" class="camera-circle">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
        </div>

        <button id="btnRemovePreview" class="btn-remove-preview hidden" title="Remove">✕</button>
      </div>

      <!-- Hidden inputs -->
      <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden">
      <input type="file" id="galleryInput" accept="image/*" class="hidden">

      <!-- Choose File Option below the camera box -->
      <button id="btnChooseFile" type="button" class="btn-choose-file">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        Choose file
      </button>

      <!-- Dictate or Type Context -->
      <div class="dictate-bar">
        <button id="btnVoiceDictate" type="button" class="btn-mic" title="Dictate note">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
        </button>
        <input type="text" id="voiceNoteText" placeholder="Dictate or type quick notes..." class="input-field">
      </div>

      <!-- AI Extraction Review (auto-revealed after photo analysis) -->
      <div id="extractionBox" class="extraction-box hidden">
        <div class="fields-grid">
          <div class="form-group">
            <label class="form-label">Vendor</label>
            <input type="text" id="metaVendor" class="form-input">
          </div>
          <div class="form-group">
            <label class="form-label">Date</label>
            <input type="date" id="metaDate" class="form-input mono">
          </div>
          <div class="form-group">
            <label class="form-label">Amount</label>
            <input type="number" step="0.01" id="metaAmount" class="form-input mono">
          </div>
          <div class="form-group">
            <label class="form-label">Currency</label>
            <select id="metaCurrency" class="form-select mono">
              <option value="USD">USD ($)</option>
              <option value="EUR">EUR (€)</option>
              <option value="GBP">GBP (£)</option>
              <option value="ILS">ILS (₪)</option>
              <option value="CAD">CAD ($)</option>
              <option value="AUD">AUD ($)</option>
            </select>
          </div>
          <div class="form-group full">
            <label class="form-label">Category</label>
            <select id="metaCategory" class="form-select">
              <option value="Groceries">Groceries</option>
              <option value="Dining">Dining</option>
              <option value="Business">Business</option>
              <option value="Office & Tech">Office & Tech</option>
              <option value="Travel & Transport">Travel</option>
              <option value="Utilities">Utilities</option>
              <option value="Medical & Health">Medical</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>

        <button id="btnSubmitFile" class="btn-file-submit">
          <span id="btnSubmitSpinner" class="spinner hidden"></span>
          <span id="btnSubmitText">Save to Vault</span>
        </button>
      </div>
    </section>

    <!-- ============================================== -->
    <!-- CARD 2: RETRIEVE (Ask + Ledger Button)         -->
    <!-- ============================================== -->
    <section class="card">
      <div class="card-title-bar">
        <span class="card-heading">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Retrieve
        </span>
      </div>

      <div class="retrieval-grid">
        <!-- Field 1: Retrieval Ask (voice or text) -->
        <div class="ask-row">
          <button id="btnVoiceQuery" type="button" class="btn-mic" style="width:34px; height:34px; border-radius:10px;" title="Dictate query">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
          </button>
          <input type="text" id="queryInput" placeholder="Ask: 'Groceries in March?', 'Monitor receipt'..." class="input-field">
          <button id="btnAskQuery" type="button" class="btn-ask-submit">Ask</button>
        </div>

        <!-- Suggestion chips -->
        <div class="chips-row">
          <div class="query-chip" onclick="quickAsk('How much spent on groceries?')">🛒 Groceries</div>
          <div class="query-chip" onclick="quickAsk('Show recent hardware and tech receipts')">💻 Hardware</div>
          <div class="query-chip" onclick="quickAsk('Dining expenses this month?')">🍽️ Dining</div>
          <div class="query-chip" onclick="quickAsk('Highest receipt in the vault?')">💎 Highest</div>
        </div>

        <!-- AI Query Answer (shown if answered) -->
        <div id="aiReplyCard" class="ai-reply-card hidden">
          <div id="aiReplyContent"></div>
          <div id="aiReplyMatches" style="margin-top:10px; display:flex; flex-direction:column; gap:6px;"></div>
        </div>

        <!-- Field 2: Ledger Button (opens ledger tab/modal) -->
        <button id="btnOpenLedgerModal" type="button" class="btn-open-ledger">
          <span style="display:flex; align-items:center; gap:8px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            Open Ledger
          </span>
          <span id="ledgerCountBadge" class="ledger-badge">0 records</span>
        </button>
      </div>
    </section>

  </div>

  <!-- ============================================== -->
  <!-- MODAL: LEDGER                                  -->
  <!-- ============================================== -->
  <div id="ledgerModal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          Vault Ledger
        </div>
        <button id="btnCloseLedger" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <input type="text" id="ledgerSearchInput" class="form-input" placeholder="Filter receipts by vendor or notes...">
        <div id="ledgerList" style="display:flex; flex-direction:column; gap:8px;">
          <!-- Loaded dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================== -->
  <!-- MODAL: SETTINGS (Opened via header wheel)      -->
  <!-- ============================================== -->
  <div id="settingsModal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          Settings
        </div>
        <button id="btnCloseSettings" class="btn-close-modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Gemini API Key</label>
          <input type="password" id="inputGeminiKey" class="form-input mono" placeholder="AIzaSy...">
        </div>
        <div class="form-group">
          <label class="form-label">Model</label>
          <select id="selectGeminiModel" class="form-select mono">
            <option value="gemini-2.5-flash">gemini-2.5-flash</option>
            <option value="gemini-2.5-pro">gemini-2.5-pro</option>
            <option value="gemini-1.5-flash">gemini-1.5-flash</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Apps Script Web App URL</label>
          <input type="url" id="inputScriptUrl" class="form-input mono" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        
        <button id="btnSaveSettings" class="btn-file-submit" style="margin-top:6px;">Save Settings</button>

        <div style="display:flex; gap:8px; margin-top:4px;">
          <button id="btnTestConn" class="btn-choose-file" style="flex:1;">🔍 Test Connection</button>
          <button id="btnClearData" class="btn-choose-file" style="color:var(--rose);">Clear Cache</button>
        </div>

        <div id="testFeedback" class="hidden" style="padding:10px; border-radius:8px; background:var(--surface-raised); font-size:0.75rem; line-height:1.4;"></div>
      </div>
    </div>
  </div>

  <!-- Script -->
  <script>
    const state = {
      apiKey: localStorage.getItem('VAULT_GEMINI_KEY') || '',
      model: localStorage.getItem('VAULT_GEMINI_MODEL') || 'gemini-2.5-flash',
      scriptUrl: localStorage.getItem('VAULT_SCRIPT_URL') || '',
      cachedLedger: JSON.parse(localStorage.getItem('VAULT_CACHED_LEDGER') || '[]'),
      activeImageBase64: null,
      extractedData: null,
      isListeningDictate: false,
      isListeningQuery: false
    };

    // DOM
    const cameraBox = document.getElementById('cameraBox');
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const btnChooseFile = document.getElementById('btnChooseFile');
    const imagePreview = document.getElementById('imagePreview');
    const cameraIconWrap = document.getElementById('cameraIconWrap');
    const btnRemovePreview = document.getElementById('btnRemovePreview');

    const btnVoiceDictate = document.getElementById('btnVoiceDictate');
    const voiceNoteText = document.getElementById('voiceNoteText');
    const extractionBox = document.getElementById('extractionBox');
    const metaVendor = document.getElementById('metaVendor');
    const metaDate = document.getElementById('metaDate');
    const metaAmount = document.getElementById('metaAmount');
    const metaCurrency = document.getElementById('metaCurrency');
    const metaCategory = document.getElementById('metaCategory');
    const btnSubmitFile = document.getElementById('btnSubmitFile');
    const btnSubmitText = document.getElementById('btnSubmitText');
    const btnSubmitSpinner = document.getElementById('btnSubmitSpinner');

    const queryInput = document.getElementById('queryInput');
    const btnVoiceQuery = document.getElementById('btnVoiceQuery');
    const btnAskQuery = document.getElementById('btnAskQuery');
    const aiReplyCard = document.getElementById('aiReplyCard');
    const aiReplyContent = document.getElementById('aiReplyContent');
    const aiReplyMatches = document.getElementById('aiReplyMatches');

    const btnOpenLedgerModal = document.getElementById('btnOpenLedgerModal');
    const ledgerModal = document.getElementById('ledgerModal');
    const btnCloseLedger = document.getElementById('btnCloseLedger');
    const ledgerList = document.getElementById('ledgerList');
    const ledgerSearchInput = document.getElementById('ledgerSearchInput');
    const ledgerCountBadge = document.getElementById('ledgerCountBadge');

    const btnOpenSettings = document.getElementById('btnOpenSettings');
    const settingsModal = document.getElementById('settingsModal');
    const btnCloseSettings = document.getElementById('btnCloseSettings');
    const inputGeminiKey = document.getElementById('inputGeminiKey');
    const selectGeminiModel = document.getElementById('selectGeminiModel');
    const inputScriptUrl = document.getElementById('inputScriptUrl');
    const btnSaveSettings = document.getElementById('btnSaveSettings');
    const btnTestConn = document.getElementById('btnTestConn');
    const btnClearData = document.getElementById('btnClearData');
    const testFeedback = document.getElementById('testFeedback');
    const syncIndicator = document.getElementById('syncIndicator');

    // Init
    window.addEventListener('DOMContentLoaded', () => {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
      inputGeminiKey.value = state.apiKey;
      selectGeminiModel.value = state.model;
      inputScriptUrl.value = state.scriptUrl;
      updateBadge();
      if (state.scriptUrl) syncLedger(true);
    });

    function updateBadge() {
      ledgerCountBadge.textContent = `${state.cachedLedger.length} records`;
    }

    // Camera & Photo Handling
    cameraBox.addEventListener('click', (e) => {
      if (e.target.closest('#btnRemovePreview')) return;
      if (!state.activeImageBase64) cameraInput.click();
    });

    btnChooseFile.addEventListener('click', () => galleryInput.click());
    cameraInput.addEventListener('change', handleFile);
    galleryInput.addEventListener('change', handleFile);

    function handleFile(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      showToast("Optimizing photo...", "normal");

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const maxDim = 1600;
          let w = img.width, h = img.height;
          if (w > h && w > maxDim) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else if (h > maxDim) { w = Math.round((w * maxDim) / h); h = maxDim; }

          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);

          const compressed = canvas.toDataURL('image/jpeg', 0.82);
          state.activeImageBase64 = compressed;

          imagePreview.src = compressed;
          imagePreview.classList.remove('hidden');
          cameraIconWrap.classList.add('hidden');
          btnRemovePreview.classList.remove('hidden');

          analyzeReceipt();
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    btnRemovePreview.addEventListener('click', (e) => {
      e.stopPropagation();
      resetIntake();
    });

    function resetIntake() {
      state.activeImageBase64 = null;
      state.extractedData = null;
      imagePreview.src = '';
      imagePreview.classList.add('hidden');
      cameraIconWrap.classList.remove('hidden');
      btnRemovePreview.classList.add('hidden');
      extractionBox.classList.add('hidden');
      cameraInput.value = '';
      galleryInput.value = '';
    }

    // Web Speech API
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recDictate = null, recQuery = null;

    if (SpeechRec) {
      recDictate = new SpeechRec();
      recDictate.onstart = () => { state.isListeningDictate = true; btnVoiceDictate.classList.add('recording'); };
      recDictate.onresult = (ev) => {
        const txt = ev.results[0][0].transcript;
        voiceNoteText.value = voiceNoteText.value ? `${voiceNoteText.value} ${txt}` : txt;
      };
      recDictate.onend = () => { state.isListeningDictate = false; btnVoiceDictate.classList.remove('recording'); };

      recQuery = new SpeechRec();
      recQuery.onstart = () => { state.isListeningQuery = true; btnVoiceQuery.classList.add('recording'); };
      recQuery.onresult = (ev) => {
        const txt = ev.results[0][0].transcript;
        queryInput.value = txt;
        executeAsk();
      };
      recQuery.onend = () => { state.isListeningQuery = false; btnVoiceQuery.classList.remove('recording'); };
    }

    btnVoiceDictate.addEventListener('click', () => {
      if (!recDictate) { showToast("Speech dictation not supported in this browser", "error"); return; }
      if (state.isListeningDictate) recDictate.stop(); else recDictate.start();
    });

    btnVoiceQuery.addEventListener('click', () => {
      if (!recQuery) { showToast("Speech dictation not supported in this browser", "error"); return; }
      if (state.isListeningQuery) recQuery.stop(); else recQuery.start();
    });

    // Gemini Vision Analysis
    async function analyzeReceipt() {
      if (!state.apiKey) {
        showToast("Set your Gemini API Key in Settings (⚙️)", "error");
        openSettings();
        return;
      }

      showToast("Gemini AI analyzing receipt...", "normal");

      const rawBase64 = state.activeImageBase64.split(',')[1];
      const prompt = `Analyze this receipt. User note: "${voiceNoteText.value}". Extract structured details.`;

      const payload = {
        contents: [{
          parts: [
            { text: prompt },
            { inlineData: { mimeType: "image/jpeg", data: rawBase64 } }
          ]
        }],
        generationConfig: {
          responseMimeType: "application/json",
          responseSchema: {
            type: "OBJECT",
            properties: {
              date: { type: "STRING" },
              vendor: { type: "STRING" },
              totalAmount: { type: "NUMBER" },
              currency: { type: "STRING" },
              category: { type: "STRING" },
              itemsSummary: { type: "STRING" }
            },
            required: ["date", "vendor", "totalAmount", "currency", "category"]
          }
        }
      };

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        const extracted = JSON.parse(data.candidates[0].content.parts[0].text);
        state.extractedData = extracted;

        metaVendor.value = extracted.vendor || '';
        metaDate.value = extracted.date || new Date().toISOString().slice(0, 10);
        metaAmount.value = extracted.totalAmount || '';
        if (extracted.currency) metaCurrency.value = extracted.currency.toUpperCase();
        if (extracted.category) metaCategory.value = extracted.category;

        extractionBox.classList.remove('hidden');
        showToast("Receipt extracted - tap Save", "success");
      } catch (err) {
        console.error(err);
        metaDate.value = new Date().toISOString().slice(0, 10);
        extractionBox.classList.remove('hidden');
        showToast("Ready to save", "normal");
      }
    }

    // Save Receipt to Apps Script
    btnSubmitFile.addEventListener('click', async () => {
      if (!state.scriptUrl) {
        showToast("Set your Apps Script URL in Settings (⚙️)", "error");
        openSettings();
        return;
      }

      btnSubmitSpinner.classList.remove('hidden');
      btnSubmitText.textContent = "Saving...";
      btnSubmitFile.disabled = true;

      const metadata = {
        vendor: metaVendor.value.trim() || 'Unknown',
        date: metaDate.value || new Date().toISOString().slice(0, 10),
        totalAmount: parseFloat(metaAmount.value) || 0,
        currency: metaCurrency.value || 'USD',
        category: metaCategory.value || 'General',
        notes: voiceNoteText.value.trim()
      };

      try {
        const res = await fetch(state.scriptUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'save_receipt',
            imageBase64: state.activeImageBase64,
            metadata: metadata
          })
        });

        const result = await res.json();
        if (result.status === 'success') {
          showToast("Saved to Google Drive & Sheets!", "success");
          voiceNoteText.value = '';
          resetIntake();
          syncLedger();
        } else {
          throw new Error(result.message || "Failed");
        }
      } catch (err) {
        showToast("Save failed: " + err.message, "error");
      } finally {
        btnSubmitSpinner.classList.add('hidden');
        btnSubmitText.textContent = "Save to Vault";
        btnSubmitFile.disabled = false;
      }
    });

    // Ask Query
    window.quickAsk = (q) => { queryInput.value = q; executeAsk(); };
    btnAskQuery.addEventListener('click', executeAsk);
    queryInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') executeAsk(); });

    async function executeAsk() {
      const q = queryInput.value.trim();
      if (!q) return;

      if (!state.apiKey) { showToast("Set Gemini API key in Settings (⚙️)", "error"); openSettings(); return; }
      if (!state.cachedLedger.length) { showToast("Ledger is empty.", "normal"); return; }

      aiReplyCard.classList.remove('hidden');
      aiReplyContent.innerHTML = `<span class="spinner" style="display:inline-block; vertical-align:middle; margin-right:6px;"></span> Searching vault...`;
      aiReplyMatches.innerHTML = '';

      const sys = `User document ledger: ${JSON.stringify(state.cachedLedger)}. Answer user question with calculations. Return JSON: {"answer":"...", "matchingRowIds":[1,2]}`;

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${state.model}:generateContent?key=${state.apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: q }] }],
            systemInstruction: { parts: [{ text: sys }] },
            generationConfig: { responseMimeType: "application/json" }
          })
        });
        const data = await res.json();
        const parsed = JSON.parse(data.candidates[0].content.parts[0].text);

        aiReplyContent.textContent = parsed.answer;
        const matches = state.cachedLedger.filter(r => (parsed.matchingRowIds || []).includes(r.rowId));
        aiReplyMatches.innerHTML = matches.map(r => `
          <div class="receipt-item" style="padding:8px; font-size:0.8rem;">
            <div>
              <div style="font-weight:700; color:#FFF;">${escapeHtml(r.vendor || 'Unknown')}</div>
              <div style="font-size:0.68rem; color:var(--text-faint);">${r.date} • ${r.category}</div>
            </div>
            <div style="text-align:right;">
              <div style="font-weight:700; color:var(--emerald);">${r.totalAmount} ${r.currency}</div>
              ${r.driveFileUrl ? `<a href="${r.driveFileUrl}" target="_blank" class="btn-drive-link">Drive ↗</a>` : ''}
            </div>
          </div>
        `).join('');
      } catch (err) {
        aiReplyContent.innerHTML = `<span style="color:var(--rose);">Error: ${escapeHtml(err.message)}</span>`;
      }
    }

    // Ledger Sync & Modal
    async function syncLedger(silent = false) {
      if (!state.scriptUrl) { syncIndicator.className = "sync-indicator error"; return; }
      syncIndicator.className = "sync-indicator syncing";

      try {
        const res = await fetch(`${state.scriptUrl}?action=get_records&_t=${Date.now()}`);
        const data = await res.json();
        if (data.status === 'success') {
          state.cachedLedger = data.records || [];
          localStorage.setItem('VAULT_CACHED_LEDGER', JSON.stringify(state.cachedLedger));
          updateBadge();
          renderLedger();
          syncIndicator.className = "sync-indicator";
          if (!silent) showToast(`Synced ${state.cachedLedger.length} records`, "success");
        }
      } catch (e) {
        syncIndicator.className = "sync-indicator error";
      }
    }

    function renderLedger() {
      const q = (ledgerSearchInput.value || '').toLowerCase().trim();
      let records = state.cachedLedger;
      if (q) {
        records = records.filter(r => (r.vendor||'').toLowerCase().includes(q) || (r.category||'').toLowerCase().includes(q) || (r.notes||'').toLowerCase().includes(q));
      }

      if (!records.length) {
        ledgerList.innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-faint); font-size:0.82rem;">No receipts found</div>`;
        return;
      }

      ledgerList.innerHTML = records.map(r => `
        <div class="receipt-item">
          <div>
            <div class="receipt-vendor">${escapeHtml(r.vendor || 'Unknown')}</div>
            <div class="receipt-meta">
              <span>📅 ${escapeHtml(r.date || '')}</span>
              <span class="receipt-tag">${escapeHtml(r.category || 'General')}</span>
            </div>
            ${r.notes ? `<div style="font-size:0.72rem; color:var(--text-faint); margin-top:2px;">💬 ${escapeHtml(r.notes)}</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div class="receipt-amount">${Number(r.totalAmount||0).toFixed(2)} ${r.currency||'USD'}</div>
            ${r.driveFileUrl ? `<a href="${escapeHtml(r.driveFileUrl)}" target="_blank" class="btn-drive-link">Drive ↗</a>` : ''}
          </div>
        </div>
      `).join('');
    }

    ledgerSearchInput.addEventListener('input', renderLedger);

    btnOpenLedgerModal.addEventListener('click', () => {
      renderLedger();
      ledgerModal.classList.remove('hidden');
    });
    btnCloseLedger.addEventListener('click', () => ledgerModal.classList.add('hidden'));

    // Settings Modal
    function openSettings() { settingsModal.classList.remove('hidden'); }
    btnOpenSettings.addEventListener('click', openSettings);
    btnCloseSettings.addEventListener('click', () => settingsModal.classList.add('hidden'));

    btnSaveSettings.addEventListener('click', () => {
      const key = inputGeminiKey.value.trim();
      const model = selectGeminiModel.value;
      const url = inputScriptUrl.value.trim();

      localStorage.setItem('VAULT_GEMINI_KEY', key);
      localStorage.setItem('VAULT_GEMINI_MODEL', model);
      localStorage.setItem('VAULT_SCRIPT_URL', url);

      state.apiKey = key;
      state.model = model;
      state.scriptUrl = url;

      showToast("Settings saved!", "success");
      settingsModal.classList.add('hidden');
      if (url) syncLedger();
    });

    btnTestConn.addEventListener('click', async () => {
      testFeedback.classList.remove('hidden');
      testFeedback.innerHTML = `<span class="spinner" style="display:inline-block; vertical-align:middle; margin-right:4px;"></span> Testing...`;

      const res = [];
      if (inputGeminiKey.value.trim()) {
        try {
          const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${inputGeminiKey.value.trim()}`);
          res.push(r.ok ? `✅ Gemini API connected` : `❌ Gemini key failed`);
        } catch(e) { res.push(`❌ Gemini error: ${e.message}`); }
      }
      if (inputScriptUrl.value.trim()) {
        try {
          const r = await fetch(`${inputScriptUrl.value.trim()}?action=ping&_t=${Date.now()}`);
          const d = await r.json();
          res.push(d.status === 'success' ? `✅ Apps Script connected` : `⚠️ Backend: ${d.message}`);
        } catch(e) { res.push(`❌ Apps Script ping failed`); }
      }
      testFeedback.innerHTML = res.join('<br>') || 'Enter keys first';
    });

    btnClearData.addEventListener('click', () => {
      if (confirm("Clear local cache?")) {
        localStorage.removeItem('VAULT_CACHED_LEDGER');
        state.cachedLedger = [];
        updateBadge();
        renderLedger();
        showToast("Cache cleared", "normal");
      }
    });

    // Helpers
    function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    let toastTimer;
    function showToast(msg, type="normal") {
      const t = document.getElementById('statusToast');
      document.getElementById('toastMsg').textContent = msg;
      t.className = `status-toast show ${type}`;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { t.className = "status-toast"; }, 2800);
    }
  </script>
</body>
</html>
